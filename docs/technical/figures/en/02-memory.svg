<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img"><title>02 · Three different memories</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">02 · Three different memories</text><rect x="25" y="80" width="290" height="160" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="40" y="109">Disk / SD</text><text class="text" x="40" y="137">All files</text><text class="text" x="40" y="162">Complete vocabulary</text><text class="text" x="40" y="187">Persists without power</text><rect x="355" y="80" width="290" height="160" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="370" y="109">Z80 RAM</text><text class="text" x="370" y="137">512 KiB mapper</text><text class="text" x="370" y="162">Game, indexes, stack and cache</text><text class="text" x="370" y="187">64 KiB visible through pages</text><rect x="685" y="80" width="290" height="160" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="700" y="109">OPL4 RAM</text><text class="text" x="700" y="137">2 MiB</text><text class="text" x="700" y="162">Samples and headers</text><text class="text" x="700" y="187">Read by the sound chip</text><path d="M315,160 L355,160" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M645,160 L685,160" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/></svg>