<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img"><title>01 · Two languages, two graphics options</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">01 · Two languages, two graphics options</text><rect x="30" y="70" width="425" height="90" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="45" y="99">QUIJOTE.BAT → QMENU ES</text><text class="text" x="45" y="127">Spanish text, commands and speech</text><rect x="545" y="70" width="425" height="90" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="560" y="99">QUIXOTE.BAT → QMENU EN</text><text class="text" x="560" y="127">English text, commands and speech</text><rect x="30" y="250" width="425" height="95" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="45" y="279">1 → MSX1 or later</text><text class="text" x="45" y="307">Q1ES.COM / Q1EN.COM</text><text class="text" x="45" y="332">Original pictures</text><rect x="545" y="250" width="425" height="95" rx="8" fill="white" stroke="#845b9e" stroke-width="2"/><text class="title" x="560" y="279">2 → MSX2 or later</text><text class="text" x="560" y="307">Q2ES.COM / Q2EN.COM</text><text class="text" x="560" y="332">Improved illustrations</text><path d="M240,160 L240,250" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,160 L760,250" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M450,160 L545,250" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M550,160 L455,250" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/></svg>