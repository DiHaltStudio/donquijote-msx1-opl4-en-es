<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img"><title>05 · From text to playback</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">05 · From text to playback</text><rect x="25" y="70" width="285" height="110" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="40" y="99">Game string</text><text class="text" x="40" y="127">Normalize text</text><text class="text" x="40" y="152">CRC-CCITT + length</text><rect x="355" y="70" width="290" height="110" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="370" y="99">Key → timing score</text><text class="text" x="370" y="127">Six-byte events</text><text class="text" x="370" y="152">Delta, unit and margin</text><rect x="690" y="70" width="285" height="110" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="705" y="99">Prepare phrase</text><text class="text" x="705" y="127">Locate every unit</text><text class="text" x="705" y="152">Load only missing samples</text><rect x="160" y="290" width="680" height="110" rx="8" fill="white" stroke="#845b9e" stroke-width="2"/><text class="title" x="175" y="319">OPL4: sample cache and local headers</text><text class="text" x="175" y="347">One copy of each unit; headers per event</text><text class="text" x="175" y="372">Scheduled triggers on two alternating channels</text><path d="M310,125 L355,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M645,125 L690,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M835,180 L680,290" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/></svg>