<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img"><title>08 · Arranque y cambio de parte</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">08 · Arranque y cambio de parte</text><rect x="30" y="65" width="270" height="115" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="45" y="94">Menú e informe</text><text class="text" x="45" y="122">Idioma y MSX1/MSX2</text><text class="text" x="45" y="147">ENTER confirma la memoria</text><rect x="365" y="65" width="270" height="115" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="380" y="94">Presentación DiHalt</text><text class="text" x="380" y="122">Logo y fanfarria OPL4</text><text class="text" x="380" y="147">Después: contraseña</text><rect x="700" y="65" width="270" height="115" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="715" y="94">Elegir parte</text><text class="text" x="715" y="122">Entrada vacía → A</text><text class="text" x="715" y="147">Clave válida → B</text><rect x="70" y="295" width="390" height="135" rx="8" fill="white" stroke="#845b9e" stroke-width="2"/><text class="title" x="85" y="324">Portada A → tecla nueva</text><text class="text" x="85" y="352">Comienza la primera parte</text><text class="text" x="85" y="377">El final enlaza con B</text><text class="text" x="85" y="402">Sin volver a pedir la contraseña</text><rect x="560" y="295" width="390" height="135" rx="8" fill="white" stroke="#65798b" stroke-width="2"/><text class="title" x="575" y="324">Portada B → tecla nueva</text><text class="text" x="575" y="352">Comienza la segunda parte</text><text class="text" x="575" y="377">Ambas portadas esperan sin límite</text><text class="text" x="575" y="402">El ENTER anterior se descarta</text><path d="M300,125 L365,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M635,125 L700,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,180 L270,295" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M880,180 L760,295" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M460,360 L560,360" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/></svg>