<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img"><title>05 · Del texto a la reproducción</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">05 · Del texto a la reproducción</text><rect x="25" y="70" width="285" height="110" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="40" y="99">Cadena del juego</text><text class="text" x="40" y="127">Normalizar texto</text><text class="text" x="40" y="152">CRC-CCITT + longitud</text><rect x="355" y="70" width="290" height="110" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="370" y="99">Clave → partitura</text><text class="text" x="370" y="127">Eventos de seis bytes</text><text class="text" x="370" y="152">Delta, unidad y margen</text><rect x="690" y="70" width="285" height="110" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="705" y="99">Preparar frase</text><text class="text" x="705" y="127">Buscar todas las unidades</text><text class="text" x="705" y="152">Cargar sólo las ausentes</text><rect x="160" y="290" width="680" height="110" rx="8" fill="white" stroke="#845b9e" stroke-width="2"/><text class="title" x="175" y="319">OPL4: caché de muestras y cabeceras locales</text><text class="text" x="175" y="347">Una copia de cada unidad; cabeceras por evento</text><text class="text" x="175" y="372">Disparos programados en dos canales alternos</text><path d="M310,125 L355,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M645,125 L690,125" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M835,180 L680,290" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/></svg>