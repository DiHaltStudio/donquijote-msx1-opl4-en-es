<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img"><title>04 · Ir a DOS y regresar al juego</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">04 · Ir a DOS y regresar al juego</text><rect x="30" y="75" width="420" height="110" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="45" y="104">1 · Juego → puente</text><text class="text" x="45" y="132">DI; guardar registros y pila</text><text class="text" x="45" y="157">Archivo, offset y longitud</text><rect x="550" y="75" width="420" height="110" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="565" y="104">2 · Contexto de DOS</text><text class="text" x="565" y="132">Slots, segmentos y pila propios</text><text class="text" x="565" y="157">BDOS lee a la transferencia</text><rect x="550" y="265" width="420" height="110" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="565" y="294">3 · Preparar retorno</text><text class="text" x="565" y="322">Recuperar primero la pila</text><text class="text" x="565" y="347">ENASLT BASIC → RAM; mapper</text><rect x="30" y="265" width="420" height="110" rx="8" fill="white" stroke="#845b9e" stroke-width="2"/><text class="title" x="45" y="294">4 · Continuar el juego</text><text class="text" x="45" y="322">Registros y contexto restaurados</text><text class="text" x="45" y="347">Usar los bytes leídos</text><path d="M450,130 L550,130" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M760,185 L760,265" fill="none" stroke="#416075" stroke-width="2" marker-end="url(#arrow)"/><path d="M550,320 L450,320" fill="none" stroke="#416075" stroke-width="2" marke