<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"><title>06 · Reparto de los 2 MiB de RAM OPL4</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#416075"/></marker></defs><rect width="1000" height="100%" fill="#f5f8fb"/><style>text{font-family:DejaVu Sans,sans-serif;fill:#19354a}.title{font-size:21px;font-weight:bold}.text{font-size:16px}</style><text class="title" x="25" y="34">06 · Reparto de los 2 MiB de RAM OPL4</text><rect x="30" y="65" width="940" height="80" rx="8" fill="white" stroke="#176e91" stroke-width="2"/><text class="title" x="45" y="94">200000h–2007FFh</text><text class="text" x="45" y="122">Reserva para cabeceras de reproducción</text><rect x="30" y="160" width="940" height="100" rx="8" fill="white" stroke="#df8e26" stroke-width="2"/><text class="title" x="45" y="189">200800h–3FDFFFh</text><text class="text" x="45" y="217">Pool de muestras PCM: ocho ceros + núcleo + ocho ceros</text><text class="text" x="45" y="242">Reutilización por ID y generación</text><rect x="30" y="275" width="940" height="85" rx="8" fill="white" stroke="#34856d" stroke-width="2"/><text class="title" x="45" y="304">3FE000h–3FFFFFh</text><text class="text" x="45" y="332">Directorio: dirección del núcleo (3 B) + generación (1 B)</text></svg>